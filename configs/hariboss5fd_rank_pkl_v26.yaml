# hariboss5fd_rank_pkl_v26.yaml
# BridgeBind3D v26 — Bug fixes + pharmacophore features + soft-RP loss
#
# Changes vs v25:
#   1. BUG FIX: circle_gamma is now correctly passed to _circle_loss_pocket().
#      v25 was silently using gamma=80 (the default) instead of the configured
#      gamma=32, causing loss to be stuck at 28-30 instead of ~11.
#   2. NEW LOSS: lambda_soft_rp=0.15 — differentiable rank percentile loss
#      that directly optimises the evaluation metric (RP).
#   3. NEW RNA FEATURES: +3 pharmacophore features per nucleotide (purine flag,
#      H-bond donor count, H-bond acceptor count derived from Watson-Crick
#      base chemistry). RNA node dim: 7 → 10 (+1 pocket flag → 11 total).
#   4. NEW LIGAND FEATURES: +2 pharmacophore features per atom (H-bond donor
#      flag, H-bond acceptor flag). Ligand node dim: 9 → 11.
#
# Expected impact:
#   - Fix 1 alone should drop loss from 28-30 → ~11 and unlock further RP gain.
#   - Fix 3+4 give the model explicit pharmacophore matching signal for free.
#   - Fix 2 aligns the training signal with the evaluation metric.

seed: 42

data:
  pkl_path: /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/hariboss_5fd_cov08_clustered_seqid_0.3_clean.pkl
  decoy_lookup_path: /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/BridgeBind3D/data/decoy_fp2_lookup.pkl
  rna3d_dirs:
    - /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/rnamigos2/data/json_pockets_3d
    - /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/BridgeBind3D/data/json_pockets_cif

model:
  version: 3
  embed_dim: 256
  num_heads: 4
  dropout: 0.1
  max_rna_tokens: 80
  max_lig_tokens: 64

  include_pocket_feat: true

  rna_tower:
    encoder_type: egnn
    num_layers: 6

  interaction:
    num_layers: 4
    use_dist_bias: true

  use_pretrained_ligand: false

  ligand_tower:
    num_layers: 4

  projection:
    dim: 256
    normalize: true

train:
  batch_size: 2
  epochs: 25
  steps_per_epoch: 2500
  lr: 8.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0

  lr_scheduler:
    type: cosine
    warmup_steps: 500
    min_lr_ratio: 0.02

  decoy_curriculum:
    stage1_negatives_per_positive: 12
    stage2_negatives_per_positive: 48
    stage3_negatives_per_positive: 72
    cross_pocket_ratio: 0.85

  val_decoy_k: 100

hard_negative_mining:
  enabled: true
  start_epoch: 5
  refresh_every: 3
  top_k: 64
  candidate_pool_size: 200

loss:
  use_circle_loss: true
  circle_gamma: 32.0           # now correctly applied (was silently 80 in v25)
  ranking_margin: 0.25

  adaptive_margin: true

  # Soft-RP: differentiable rank percentile loss (directly optimises RP metric)
  lambda_soft_rp: 0.15
  soft_rp_temp: 0.1

  contrastive_temperature_start: 0.25
  contrastive_temperature_end:   0.15

  ranking_margin_end: 0.25
  margin_restart_epochs: 0
  hard_margin_topk: 0

  lambda_contrast: 1.0
  lambda_rank: 0.3
  lambda_rna_contrast: 1.0
  lambda_site: 0.3
  site_start_epoch: 7

schedule:
  stage1_epochs: 5
  stage2_epochs: 5

output:
  checkpoint_dir: /blue/qsong1/liangjialu/bb3d_v26/bugfix_pharma_softrp_fold0
  log_every: 50
  val_max_pockets: 200

early_stopping:
  reload_patience: 2
  reload_lr_scale: 0.5
  patience: 10
