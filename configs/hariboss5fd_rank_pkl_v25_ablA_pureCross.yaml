# hariboss5fd_rank_pkl_v25_ablA_pureCross.yaml
# Ablation A: K=36 fixed, cross_pocket_ratio = 1.0  (cross=36, hard=0)
# Tests whether removing all FP2 hard decoys at the v24 plateau K improves RP.
#
# Run on fold 0 only:
#   sbatch --array=0 scripts/slurm_train_hariboss5fd_rank_pkl_v25_abl.sh ablA_pureCross
seed: 42

data:
  pkl_path: /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/hariboss_5fd_cov08_clustered_seqid_0.3_clean.pkl
  decoy_lookup_path: /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/BridgeBind3D/data/decoy_fp2_lookup.pkl
  rna3d_dirs:
    - /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/rnamigos2/data/json_pockets_3d
    - /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/BridgeBind3D/data/json_pockets_cif

model:
  version: 3
  embed_dim: 256
  num_heads: 4
  dropout: 0.1
  max_rna_tokens: 80
  max_lig_tokens: 64
  include_pocket_feat: true
  rna_tower: {encoder_type: egnn, num_layers: 6}
  interaction: {num_layers: 4, use_dist_bias: true}
  use_pretrained_ligand: false
  ligand_tower: {num_layers: 4}
  projection: {dim: 256, normalize: true}

train:
  batch_size: 2
  epochs: 12
  steps_per_epoch: 2500
  lr: 8.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_scheduler: {type: cosine, warmup_steps: 500, min_lr_ratio: 0.02}
  decoy_curriculum:
    stage1_negatives_per_positive: 36
    stage2_negatives_per_positive: 36
    stage3_negatives_per_positive: 36
    cross_pocket_ratio: 1.0          # pure cross-pocket
  val_decoy_k: 100

hard_negative_mining:
  enabled: false                     # no hard decoys → nothing to mine

loss:
  use_circle_loss: true
  circle_gamma: 32.0
  ranking_margin: 0.25
  adaptive_margin: true
  contrastive_temperature_start: 0.25
  contrastive_temperature_end: 0.15
  ranking_margin_end: 0.25
  margin_restart_epochs: 0
  hard_margin_topk: 0
  lambda_contrast: 1.0
  lambda_rank: 0.3
  lambda_rna_contrast: 1.0
  lambda_site: 0.3
  site_start_epoch: 7

schedule:
  stage1_epochs: 0
  stage2_epochs: 0                   # all stages share K=36

output:
  checkpoint_dir: /blue/qsong1/liangjialu/bb3d_v25_abl/ablA_pureCross_fold0
  log_every: 50
  val_max_pockets: 200

early_stopping:
  reload_patience: 2
  reload_lr_scale: 0.5
  patience: 8
