[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bridgebind3d"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "rdkit>=2023.3",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
