# hariboss5fd_rank_pkl_v11.yaml
# ─────────────────────────────────────────────────────────────────────────────
# BridgeBind3D v11 — v9 + Dual Contrastive Loss (RNA-side InfoNCE)
#
# 核心改动 vs v9：
#   ① 新增 loss.lambda_rna_contrast: 1.0
#      RNA-side InfoNCE: 同一 mini-batch 内, native_lig_i 与 rna_i 的相似度
#      应高于 native_lig_i 与所有其他 rna_j (j≠i) 的相似度
#      = SMARTBind 的 rna_cts_loss (对称 dual contrastive)
#      复用已有的 L2-normalised z_rna / z_lig, 无额外 forward pass
#   ② 架构完全同 v9 (EGNN-6L + GIN-4L + DistBiasedSelfAttn 4L)
#   ③ 所有其他训练设置同 v9
#
# 实现细节:
#   for each native (lig_i, rna_i):
#     sim_matrix[i,j] = z_lig_i · z_rna_j / T   (P×P)
#     loss_rna = CrossEntropy(sim_matrix, arange(P))  ← diagonal = positive
#
# v9 result: mean RP = 0.7441  (gap 0.035)
# v11 预计:  mean RP ~ 0.748~0.756  (gap ~0.023~0.031)
# ─────────────────────────────────────────────────────────────────────────────

seed: 42

data:
  pkl_path: /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/hariboss_5fd_cov08_clustered_seqid_0.3_clean.pkl
  decoy_lookup_path: /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/neq/data/decoy_fp2_lookup.pkl
  rna3d_dirs:
    - /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/rnamigos2/data/json_pockets_3d
    - /home/liangjialu/blue_qsong1/liangjialu/data/test_RNA/new/neq/data/json_pockets_cif

model:
  version: 3                # 同 v9: UnifiedInteractionModelV3
  embed_dim: 256
  num_heads: 4
  dropout: 0.1
  max_rna_tokens: 80
  max_lig_tokens: 64

  include_pocket_feat: true

  rna_tower:
    encoder_type: egnn
    num_layers: 6

  interaction:
    num_layers: 4
    use_dist_bias: true     # 继承 v9 DistBiasedSelfAttnBlock

  use_pretrained_ligand: false

  ligand_tower:
    num_layers: 4

  projection:
    dim: 256
    normalize: true

train:
  batch_size: 8
  epochs: 15
  steps_per_epoch: 1500
  lr: 1.5e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

  lr_scheduler:
    type: cosine
    warmup_steps: 500
    min_lr_ratio: 0.02

  decoy_curriculum:
    stage1_negatives_per_positive: 4
    stage2_negatives_per_positive: 10
    stage3_negatives_per_positive: 20
    cross_pocket_ratio: 0.67

  val_decoy_k: 100

hard_negative_mining:
  enabled: true
  start_epoch: 5
  refresh_every: 3
  n_candidates: 40
  keep_frac: 0.5

loss:
  contrastive_temperature: 0.2
  ranking_margin: 0.30
  ranking_margin_end: 0.05
  lambda_contrast: 1.0
  lambda_rank: 1.0
  lambda_rna_contrast: 1.0   # ← v11 新增: RNA-side dual contrastive loss
  lambda_site: 0.3
  site_start_epoch: 7

schedule:
  stage1_epochs: 5
  stage2_epochs: 5

output:
  checkpoint_dir: /blue/qsong1/liangjialu/bb3d_v11_base/dual_contrast_v11_fold0
  log_every: 50
  val_max_pockets: 200

early_stopping:
  reload_patience: 2
  reload_lr_scale: 0.5
  patience: 5
